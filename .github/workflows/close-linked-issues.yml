name: Close Linked Issues on Release Branch Merge

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close-issues:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Close issues linked in PR
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            if (!/^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/.test(base)) {
              core.info(`Base branch "${base}" is not a release branch, skipping.`);
              return;
            }

            const title = context.payload.pull_request.title || '';
            const body = context.payload.pull_request.body || '';
            const text = `${title}\n${body}`;
            const keywordRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+#(\d+)/gi;

            const issueNumbers = new Set();
            let match;
            while ((match = keywordRe.exec(text)) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info('No linked issues found in PR title/body.');
              return;
            }

            for (const issue_number of issueNumbers) {
              core.info(`Closing issue #${issue_number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `Closed by #${context.payload.pull_request.number}, merged into \`${base}\`.`,
              });
            }
