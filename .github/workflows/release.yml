name: Release on Git Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Build binary for ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="relay-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -ldflags "-X main.Version=${{ env.VERSION }}" -o "${BINARY_NAME}" .
          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for tag dates

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Get previous tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ env.VERSION }}^" 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV

      - name: Generate changelog from satisfaction criteria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/generate-changelog.sh
          ./scripts/generate-changelog.sh "$PREV_TAG" "${{ env.VERSION }}" > changelog.md

      - name: Assemble release body
        run: |
          cat <<'EOF' > release-body.md
          A terminal-based API client built for the Boot.dev Hackathon 2025.

          **Installation:**
          ```bash
                    go install github.com/yashranjan1/relay@${{ env.VERSION }}
          ```

          **Prebuilt binaries:**
          - Linux: `relay-${{ env.VERSION }}-linux-amd64`, `relay-${{ env.VERSION }}-linux-arm64`
          - macOS: `relay-${{ env.VERSION }}-darwin-amd64`, `relay-${{ env.VERSION }}-darwin-arm64`
          - Windows: `relay-${{ env.VERSION }}-windows-amd64.exe`

          **Usage:** Run `relay` in your terminal

          **Note:** This is early development software. Core HTTP execution features are still in progress.
          EOF
          cat changelog.md >> release-body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "relay ${{ env.VERSION }}"
          body_path: release-body.md
          files: ./binaries/**/*
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
